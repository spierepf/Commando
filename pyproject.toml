[project]
name = "commando"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Peter-Frank Spierenburg", email = "spierepf@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "icecream>=2.2.0",
    "load-dotenv>=0.1.0",
    "pexpect>=4.9.0",
]

[project.scripts]
commando = "commando:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
